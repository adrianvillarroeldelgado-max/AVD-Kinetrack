<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f2c42">
<meta name="description" content="Diagnóstico orientativo, pruebas clínicas y programas de rehabilitación de lesiones deportivas.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}html,body{height:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Kinetrack Lesiones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: consola clínica — riel lateral en escritorio, barra inferior en móvil; contenido como fichas de historia clínica. Acento: rosa de vendaje neuromuscular sobre azul hospital. */
:root{
  --bg:#edf1f4; --surface:#ffffff; --sunk:#e2e8ed; --ink:#13202b; --muted:#566775; --line:#d2dbe2;
  --deep:#0f2c42; --deep-ink:#e6eef5; --deep-muted:#9fb4c6;
  --accent:#d62e69; --accent-soft:#fbe2eb; --accent-ink:#ffffff;
  --ok:#1b7a50; --ok-soft:#d9efe3; --warn:#9a5d00; --warn-soft:#faedd3; --bad:#b92e28; --bad-soft:#fadfdc; --info:#25587d; --info-soft:#dde9f3;
  --f-display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c141a; --surface:#141f28; --sunk:#1b2833; --ink:#e4ecf2; --muted:#93a5b3; --line:#263540;
  --deep:#081a27; --deep-ink:#e4ecf2; --deep-muted:#8aa1b3;
  --accent:#ff5c92; --accent-soft:#3b1a28; --accent-ink:#1a0710;
  --ok:#5fd09a; --ok-soft:#14321f; --warn:#f0b450; --warn-soft:#382a10; --bad:#ff7a70; --bad-soft:#3d1714; --info:#8ec3ea; --info-soft:#142b3c;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0c141a; --surface:#141f28; --sunk:#1b2833; --ink:#e4ecf2; --muted:#93a5b3; --line:#263540;
  --deep:#081a27; --deep-ink:#e4ecf2; --deep-muted:#8aa1b3;
  --accent:#ff5c92; --accent-soft:#3b1a28; --accent-ink:#1a0710;
  --ok:#5fd09a; --ok-soft:#14321f; --warn:#f0b450; --warn-soft:#382a10; --bad:#ff7a70; --bad-soft:#3d1714; --info:#8ec3ea; --info-soft:#142b3c;
  color-scheme:dark }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--deep)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(30px,5vw,40px);text-transform:uppercase}
h2{font-size:24px;text-transform:uppercase}
h3{font-size:20px}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)} .small{font-size:13px}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* App frame */
.app{min-height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--deep);color:var(--deep-ink);grid-column:1/-1}
.top-in{display:flex;align-items:center;gap:12px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-family:var(--f-display);font-weight:700;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.brand svg{width:28px;height:28px;flex:none}
.top-case{margin-left:auto;display:flex;align-items:center;gap:8px;min-width:0}
.top-case select{min-width:0;flex:1 1 auto;max-width:320px;background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--deep-ink);border-radius:8px;padding:6px 10px}
.top-case select option{color:#13202b;background:#fff}
.btn-inv{background:transparent;border:1px solid rgba(255,255,255,.22);color:var(--deep-ink);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap}
.btn-inv:hover{border-color:var(--accent)}
@media (max-width:440px){.brand span{display:none}}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:8;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
.nav button{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:8px 2px 7px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:600;letter-spacing:.02em}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav button[aria-current="page"]{color:var(--accent)}
main{padding-top:20px;padding-bottom:calc(96px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0;outline:none}
.wrap{max-width:1160px;margin:0 auto;display:grid;gap:20px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){
  .app{grid-template-columns:200px minmax(0,1fr)}
  .nav{position:sticky;top:calc(56px + env(safe-area-inset-top,0px));align-self:start;grid-template-columns:1fr;border:0;background:transparent;padding:20px 0 0 max(16px,env(safe-area-inset-left,0px));gap:2px}
  .nav button{flex-direction:row;gap:10px;font-size:15px;padding:10px 12px;border-radius:10px;justify-content:flex-start}
  .nav button:hover{background:var(--sunk)}
  .nav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:inset 3px 0 0 var(--accent)}
  main{padding-bottom:48px;padding-left:24px}
}

/* Shared parts */
.view-head{display:grid;gap:8px;max-width:72ch}
.lede{color:var(--muted);font-size:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:grid;gap:14px;min-width:0;grid-template-columns:minmax(0,1fr)}
.card-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;cursor:pointer;font-size:14px;line-height:1.25;text-align:left}
.chip:hover{border-color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--ink);font-weight:600}
.chip.red[aria-pressed="true"]{background:var(--bad-soft);border-color:var(--bad)}
.chip:disabled{opacity:.45;cursor:default}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:6px 10px;font-size:13px}
.linkish{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--info-soft);color:var(--info)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.note{border-radius:10px;padding:12px 14px;display:grid;gap:4px;border-left:4px solid}
.note b{font-weight:600}
.note.ok{background:var(--ok-soft);border-color:var(--ok)} .note.warn{background:var(--warn-soft);border-color:var(--warn)} .note.bad{background:var(--bad-soft);border-color:var(--bad)} .note.info{background:var(--info-soft);border-color:var(--info)}
.field{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{font-weight:400;font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;min-width:0}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
ul.clean{list-style:none;margin:0;padding:0}
.bul{margin:0;padding-left:18px;display:grid;gap:4px}

/* Diagnóstico */
.diag{display:grid;gap:20px;align-items:start}
@media (min-width:1000px){.diag{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)} .diag-out{position:sticky;top:76px}}
.diag-in{display:grid;gap:16px;min-width:0}
.zone-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
@media (max-width:520px){.zone-wrap{grid-template-columns:110px 1fr}}
.body-map{width:100%;height:auto}
.body-map .fig *{fill:var(--sunk);stroke:var(--line);stroke-width:1.5}
.body-map .hs{fill:var(--surface);stroke:var(--muted);stroke-width:1.6;cursor:pointer;transition:r .15s}
.body-map .hs:hover{stroke:var(--accent)}
.body-map .hs.on{fill:var(--accent);stroke:var(--accent)}
.diag-out{display:grid;gap:12px;min-width:0}
.res{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:10px}
.res.top1{border-color:var(--accent)}
.res-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.pct{font-family:var(--f-display);font-weight:700;font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.pct span{font-size:18px;color:var(--muted)}
.bar{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.hits{font-size:13px;color:var(--muted)}
.tchip{font-size:12px;border:1px dashed var(--line);border-radius:6px;padding:3px 8px;background:none;cursor:pointer;color:var(--ink)}
.tchip:hover{border-color:var(--accent);color:var(--accent)}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:8px;justify-items:center}

/* Biblioteca */
.lib{display:grid;gap:16px}
.lib-list{display:grid;gap:22px}
.lib-group h3{font-size:15px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.lib-items{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr))}
.lib-item{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;text-align:left;cursor:pointer;display:grid;gap:4px}
.lib-item:hover{border-color:var(--accent)}
.lib-item b{font-weight:600}
.detail{display:grid;gap:18px}
.detail-grid{display:grid;gap:16px}
@media (min-width:1000px){.detail-grid{grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}}
.grades{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.grade{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:2px}
.grade .w{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums}
.phase-table{width:100%;border-collapse:collapse;font-size:14px}
.phase-table th,.phase-table td{text-align:left;vertical-align:top;padding:10px 8px;border-top:1px solid var(--line)}
.phase-table th{font-family:var(--f-display);font-size:15px;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.scroll-x{overflow-x:auto;min-width:0;max-width:100%}

/* Pruebas */
.tests{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,330px),1fr))}
.test{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:grid;gap:8px;align-content:start}
.test.sel{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.se{display:flex;gap:8px}
.se div{flex:1;background:var(--sunk);border-radius:8px;padding:6px 10px;display:grid}
.se small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.se b{font-family:var(--f-display);font-size:20px;font-variant-numeric:tabular-nums}
.kv{display:grid;gap:2px;font-size:14px}
.kv span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* Programa */
.prog{display:grid;gap:20px;align-items:start}
@media (min-width:1000px){.prog{grid-template-columns:minmax(0,1.6fr) minmax(0,1fr)}}
.case-head{display:grid;gap:12px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:10px 16px}
.meta div{display:grid;gap:1px}
.meta span{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.meta b{font-weight:600;font-variant-numeric:tabular-nums}
.tl{position:relative;display:flex;gap:3px;height:46px;margin-top:4px}
.tl .sg{border-radius:6px;background:var(--sunk);display:flex;flex-direction:column;justify-content:center;padding:0 8px;min-width:0;overflow:hidden;border:0;cursor:pointer;text-align:left;color:var(--ink)}
.tl .sg b{font-family:var(--f-display);font-size:16px}
.tl .sg small{font-size:11px;color:var(--muted);white-space:nowrap}
.tl .sg.past{background:var(--info-soft)}
.tl .sg.cur{background:var(--accent);color:var(--accent-ink)}
.tl .sg.cur small{color:var(--accent-ink);opacity:.85}
.tl .sg.view{outline:2px solid var(--ink);outline-offset:1px}
.tl .now{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);border-radius:2px;pointer-events:none}
.tl .now::after{content:"";position:absolute;top:-4px;left:-4px;width:10px;height:10px;border-radius:50%;background:var(--ink)}
.tl-axis{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.ex-list{display:grid;gap:8px}
.ex{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;border:1px solid var(--line);border-radius:10px;padding:12px}
.ex.done{background:var(--ok-soft);border-color:transparent}
.tick{width:28px;height:28px;border-radius:8px;border:1.5px solid var(--muted);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:0}
.tick svg{width:16px;height:16px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0}
.tick[aria-pressed="true"]{background:var(--ok);border-color:var(--ok)}
.tick[aria-pressed="true"] svg{opacity:1;stroke:#fff}
.ex-idx{width:28px;height:28px;border-radius:8px;background:var(--sunk);display:grid;place-items:center;font-family:var(--f-display);font-weight:700}
.ex-name{font-weight:600}
.ex-var{color:var(--accent);font-weight:600}
.ex-dose{font-variant-numeric:tabular-nums;font-size:14px}
.ex-cue{font-size:13px;color:var(--muted)}
.vid{font-size:13px;font-weight:600;color:var(--muted);text-decoration:underline;text-underline-offset:3px;justify-self:start}
.vid.ver{color:var(--accent);text-decoration:none;border:1px solid var(--accent);border-radius:999px;padding:2px 10px}
.vid:hover{color:var(--accent)}
.vid .en{font-size:10px;letter-spacing:.06em;border:1px solid currentColor;border-radius:4px;padding:0 4px;margin-left:4px;opacity:.8}
.exc-lv>b{grid-area:lv}.exc-lv>.vid{grid-area:vid}.exc-lv>span:not(:first-child){grid-area:tx}.exc-lv>span:first-child:empty{display:none}
.wrap>.seg{justify-self:start}
.exc{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr))}
.exc-lv{display:grid;grid-template-columns:1fr auto;grid-template-areas:'lv vid' 'tx tx';gap:2px 10px;align-items:center;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.type{font-size:11px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:2px 6px;white-space:nowrap}
.crit{display:grid;gap:6px}
.crit label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;padding:6px 0}
.crit input{width:18px;height:18px;accent-color:var(--ok);margin-top:2px;flex:none}
.side{display:grid;gap:16px;min-width:0}
.src{display:inline-flex}

/* Seguimiento */
.stats{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:grid;gap:2px}
.stat b{font-family:var(--f-display);font-size:32px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.chart{width:100%;min-width:520px;height:auto;display:block}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .zone{fill:var(--bad-soft)}
.chart .lx{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .l1{stroke:var(--accent);stroke-width:2.5;fill:none}
.chart .l2{stroke:var(--info);stroke-width:2;fill:none;stroke-dasharray:5 4}
.chart .d1{fill:var(--accent)} .chart .d2{fill:var(--info)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:3px;border-radius:2px;vertical-align:middle;margin-right:6px}
.range{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center}
.range input{accent-color:var(--accent);padding:0;background:none;border:0}
.range output{font-family:var(--f-display);font-size:22px;font-weight:700;min-width:2ch;text-align:right;font-variant-numeric:tabular-nums;color:var(--ink)}
table.log{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
table.log th,table.log td{padding:8px 6px;border-top:1px solid var(--line);text-align:left;white-space:nowrap}
table.log th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
table.log td.n{white-space:normal;min-width:140px;color:var(--muted)}
table.hop{width:100%;border-collapse:collapse;font-size:14px}
table.hop th,table.hop td{padding:6px;border-top:1px solid var(--line);text-align:left}
table.hop input{width:68px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-variant-numeric:tabular-nums}
table.hop th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* Sheet + toast */
.sheet{position:fixed;inset:0;z-index:20;display:grid;place-items:end center}
@media (min-width:700px){.sheet{place-items:center}}
.sheet-bg{position:absolute;inset:0;background:rgba(8,18,26,.55)}

function zoneLists(z){
  const inj=INJ.filter(i=>i.z.includes(z));
  const m=Object.keys(MECH).filter(k=>inj.some(i=>i.mech[k]));
  const s=Object.keys(SX).filter(k=>inj.some(i=>i.sx[k]));
  const r=RED.filter(f=>f.z==='all'||f.z.includes(z));
  return {inj,m,s,r};
}
function rawScore(i,d){
  const a=parseInt(d.age,10);let score=0,max=0;const hits=[];
  const maxM=Math.max(...Object.values(i.mech));let bestM=0;
  d.mech.forEach(m=>{if(i.mech[m]){bestM=Math.max(bestM,i.mech[m]);hits.push(MECH[m])}});
  score+=bestM;max+=maxM;
  const sw=Object.values(i.sx).sort((x,y)=>y-x);
  d.sx.forEach(s=>{if(i.sx[s]){score+=i.sx[s];hits.push(SX[s])}else score-=0.75});
  const n=Math.max(1,Math.min(d.sx.length,sw.length));max+=sw.slice(0,n).reduce((p,q)=>p+q,0);
  if(i.age){max+=2;if(a>=i.age[0]&&a<=i.age[1]){score+=2;hits.push(`Edad compatible (${i.age[0]}–${i.age[1]} años)`)}else if(a)score-=4;else score-=1}
  let s=Math.max(0,score/max);
  const sp=d.sport&&SPORTS[d.sport]&&SPORTS[d.sport].p[i.id];if(sp){s*=sp;hits.push('Frecuente en '+SPORTS[d.sport].n.toLowerCase())}
  if(d.onset==='aguda'){if(i.kind==='a')s*=1.25;else if(i.kind==='o')s*=0.6}
  if(d.onset==='persistente'){if(i.kind==='o')s*=1.25;else if(i.kind==='a')s*=0.7}
  if(d.prev&&RECUR[i.id]){s*=RECUR[i.id];hits.push('Suele repetirse')}
  return {s:Math.min(1.2,s),hits};
}
function parseSE(v){const n=parseFloat(String(v).replace(/[^\d.]/g,''));return isFinite(n)&&n>0?clamp(n/100,0.05,0.99):null}
function testAcc(t){const s=parseSE(t.s),e=parseSE(t.e);return {s:s??0.7,e:e??0.7,known:s!=null&&e!=null}}
function diagnose(d){
  d=d||S.diag;if(!d.zone)return {list:[],other:0,tested:false};
  const cands=INJ.filter(i=>i.z.includes(d.zone)).map(i=>{const r=rawScore(i,d);return {inj:i,raw:r.s,hits:r.hits}});
  const anyInput=d.mech.length||d.sx.length;
  let w=cands.map(c=>anyInput?Math.pow(c.raw,2):1);
  const tot=w.reduce((a,b)=>a+b,0)||1;
  let probs=w.map(x=>0.9*x/tot);let other=0.1;
  const entries=Object.entries(d.tests||{}).filter(([k,v])=>v&&T_BY[k]);
  entries.forEach(([tid,res])=>{
    const {s,e}=testAcc(T_BY[tid]);
    const lt=res==='+'?s:1-s, lo=res==='+'?1-e:e;
    probs=probs.map((p,i)=>p*(cands[i].inj.tests.includes(tid)?lt:lo));other*=lo;
  });
  const z=probs.reduce((a,b)=>a+b,0)+other;
  probs=probs.map(p=>p/z);other/=z;
  const list=cands.map((c,i)=>({...c,p:probs[i]})).filter(c=>c.raw>0||!anyInput).sort((a,b)=>b.p-a.p).slice(0,6);
  return {list,other,tested:entries.length>0};
}

  if(has('defecto_palpable'))out.push({k:'bad',t:'Defecto palpable',m:'Sospecha de rotura completa. Valoración traumatológica en menos de 48 h.'});

  if(zone==='muneca'&&has('dolor_tabaquera'))out.push({k:'warn',t:'Dolor en tabaquera anatómica',m:'Inmovilizar el pulgar y pedir radiografía aunque el dolor sea leve.'});
  if(has('dolor_nocturno')&&has('dolor_oseo_focal'))out.push({k:'warn',t:'Dolor óseo nocturno',m:'Descartar fractura por estrés con imagen.'});

  return out;
}

/* ===================== Revisión profesional efectiva ===================== */
function revOf(c){return c._rev||(typeof CL!=='undefined'&&CL.rev[c.id])||c.pro||null}
function eff(c){
  const p=revOf(c);const pdx=p&&p.dx&&INJ_BY[p.dx]?p:null;
  const inj=INJ_BY[pdx?pdx.dx:c.injuryId]||INJ[0];
  const gi=Math.min(pdx?+pdx.g:+c.g,inj.g.length-1)||0;
  return {inj,gi,grade:inj.g[gi],src:pdx?'pro':c.src,rev:p};
}

/* ===================== Mediciones, escalas y dolor ===================== */
function latestMeas(c,k){const l=c.meas.filter(m=>m.k===k).sort(byDate);return l[l.length-1]||null}
function lsiOf(m,inv){if(!m)return null;const a=num(m.a),b=num(m.b);if(!(a>0&&b>0))return null;return Math.round(100*(inv?b/a:a/b))}
function lsiK(c,k){return lsiOf(latestMeas(c,k),MEAS_BY[k]&&MEAS_BY[k].inv)}
function hopLSI(c){const v=['hop_single','hop_triple','hop_cross','hop_6m'].map(k=>lsiK(c,k)).filter(x=>x!=null);return v.length>=2?Math.min(...v):null}
function mainStrength(c){
  const {inj}=eff(c);const id=inj.id;
  if(['isquios','isq_prox'].includes(id))return 'ham';
  if(['aductores'].includes(id))return 'add';
  if(['fai','glutea'].includes(id))return 'abd';
  const z=inj.z[0];
  if(['rodilla','muslo'].includes(z))return 'quad';
  if(['tobillo','pierna','pie'].includes(z))return 'calf_reps';
  if(z==='hombro'||z==='cuello')return 'er';
  if(z==='codo'||z==='muneca')return 'grip';
  if(z==='cadera')return 'abd';
  return 'quad';
}
function scaleScore(sc){
  const d=SCALES[sc.k];if(!d)return null;const v=sc.vals||{};const nums=a=>(a||[]).map(num).filter(x=>x!=null);
  if(d.calc==='direct'){const t=num(sc.total);if(t==null)return null;return {total:Math.round(d.conv?t/d.conv*100:t)}}
  if(d.calc==='visa'){const a=v.it||[];const n=a.slice(0,8).map(num);if(n.some(x=>x==null))return null;return {total:Math.round(n.reduce((p,q)=>p+q,0))}}
  if(d.calc==='koos'){const subs={};d.subs.forEach(s=>{const n=nums(v[s.k]);if(n.length>=Math.ceil(s.i/2))subs[s.k]=Math.round(100-(n.reduce((p,q)=>p+q,0)/n.length)*25)});const vals=Object.values(subs);if(!vals.length)return null;return {subs,total:Math.round(vals.reduce((p,q)=>p+q,0)/vals.length)}}
  if(d.calc==='pct4'){const subs={};d.subs.forEach(s=>{const n=nums(v[s.k]);if(n.length)subs[s.k]=Math.round(n.reduce((p,q)=>p+q,0)/(n.length*4)*100)});const vals=Object.values(subs);if(!vals.length)return null;return {subs,total:subs.avd??vals[0]}}
  const n=nums(v.it);
  if(d.calc==='mean10'){if(n.length<d.subs[0].i)return null;return {total:Math.round(n.reduce((p,q)=>p+q,0)/n.length*10)}}
  if(d.calc==='sum'){if(n.length<d.subs[0].i)return null;return {total:Math.round(n.reduce((p,q)=>p+q,0))}}
  if(d.calc==='qdash'){if(n.length<10)return null;return {total:Math.round((n.reduce((p,q)=>p+q,0)/n.length-1)*25)}}
  if(d.calc==='odi'){if(n.length<8)return null;return {total:Math.round(n.reduce((p,q)=>p+q,0)/(5*n.length)*100)}}
  return null;
}
function latestScale(c,k){const l=c.scales.filter(s=>s.k===k).sort(byDate);const s=l[l.length-1];return s?{...s,sc:scaleScore(s)}:null}
function mornList(c){return Object.entries(c.mornings||{}).map(([date,v])=>({date,v:+v})).sort(byDate)}
function painState(c){
  const logs=c.logs.slice().sort(byDate);const last=logs[logs.length-1];
  const ml=mornList(c);const lm=ml[ml.length-1],pm=ml[ml.length-2];
  const recentM=lm&&daysBetween(lm.date,todayISO())<=3?lm:null;
  let flag=false,why='';
  if(last&&daysBetween(last.date,todayISO())<=7&&last.during>5){flag=true;why=`dolor de ${last.during}/10 durante la sesión del ${fmtShort(last.date)}`}
  else if(recentM&&recentM.v>5){flag=true;why=`dolor de ${recentM.v}/10 al levantarse el ${fmtShort(recentM.date)}`}
  else if(recentM&&pm&&recentM.v-pm.v>=2){flag=true;why=`el dolor al levantarse subió de ${pm.v} a ${recentM.v}`}
  const alarm=last&&last.flags&&last.flags.length&&daysBetween(last.date,todayISO())<=10?last:null;
  return {flag,why,last,lm,alarm,logs};
}

/* ===================== Criterios automáticos ===================== */
function critAuto(c,text){
  const N=re=>{const m=text.match(re);return m?+m[1]:null};
  const pct=N(/≥ ?(\d+) ?%/);
  const res=(met,val)=>({met:!!met,val});
  if(/ACL-RSI/.test(text)){const n=N(/ACL-RSI ≥ ?(\d+)/);const s=latestScale(c,'acl_rsi');if(!s||!s.sc)return null;return res(s.sc.total>=n,`ACL-RSI ${s.sc.total}`)}
  if(/salto/i.test(text)&&pct){
    const h=hopLSI(c);const needF=/fuerza/i.test(text);const f=needF?lsiK(c,mainStrength(c)):null;
    if(h==null&&(!needF||f==null))return null;if(needF&&(h==null||f==null))return res(false,`saltos ${h??'—'} % · fuerza ${f??'—'} %`);
    return res(h>=pct&&(!needF||f>=pct),needF?`saltos ${h} % · fuerza ${f} %`:`LSI saltos ${h} %`);
  }
  if(/[Rr]atio rotación externa\/interna/.test(text)){const e=latestMeas(c,'er'),i=latestMeas(c,'ir');if(!e||!i||!(num(i.a)>0))return null;const r=Math.round(num(e.a)/num(i.a)*100);return res(r>=pct,`ratio ${r} %`)}
  const strengthMap=[[/cuádriceps/,'quad'],[/isquiotibiales/,'ham'],[/gemelo/,'calf_reps'],[/[Pp]rensión/,'grip'],[/Rotación externa ≥/,'er'],[/aductores|squeeze/,'add'],[/[Ff]uerza de cadera|abductores/,'abd'],[/Elevación de pierna recta ≥/,'slr_rom']];

function critState(c,p,i){

/* ===================== Programa: dosis, material y sustituciones ===================== */
const cum=w=>w.reduce((a,x)=>(a.push(a[a.length-1]+x),a),[0]);
const weeksSince=d=>Math.max(0,(Date.now()-new Date(d+'T00:00:00').getTime())/6048e5);
function eqReq(id,lv){return (EQ[id]||['n','n','n'])[lv]||'n'}
function eqOk(id,c){return eqReq(id,c.level).split('+').every(k=>k==='n'||c.equip.includes(k))}
function altFor(id,c,exclude,avoid){
  const g=GROUP_OF[id];if(!g)return null;const t=EX[id].t;
  const l=GROUPS[g].filter(x=>x!==id&&EX[x]&&!exclude.includes(x)&&!(avoid||[]).includes(x)&&eqOk(x,c));
  l.sort((a,b)=>(EX[b].t===t)-(EX[a].t===t));return l[0]||null;
}
function phaseExercises(c,p){
  const {inj,rev}=eff(c);const base=inj.ph[p].ex;const proSw=(rev&&rev.swaps)||{};
  return base.map(id=>{
    let cur=id,why=null;
    if(proSw[id]&&EX[proSw[id]]){cur=proSw[id];why='pro'}
    else if(c.swaps[id]&&EX[c.swaps[id]]){cur=c.swaps[id];why='dolor'}
    if(!eqOk(cur,c)){const a=altFor(cur,c,base,c.painful);if(a){cur=a;why=why||'material'}else why='sin-material'}
    return {orig:id,id:cur,why};
  });
}
function doseFor(c,id,ps){
  const x=EX[id];if(!DOSE2[x.t])return null;
  const b={...DOSE2[x.t][c.level]};const w=Math.floor(weeksSince(c.phaseStart||c.date));
  ps=ps||painState(c);let cue='';
  if(ps.flag){b.s=Math.max(1,b.s-1);if(b.t)b.t=Math.max(15,b.t-15);if(b.min)b.min=Math.max(10,b.min-5);cue='Carga reducida por dolor: una serie menos y 20–30 % menos de peso o intensidad.'}
  else if(w>=1){
    if(['fuerza','iso','neuro','movil','plio'].includes(x.t))b.s=Math.min(b.s+1,6);
    if(w>=2&&x.t==='fuerza')cue=`Semana ${w+1} de la fase: +1 serie y sube la carga 5–10 % si el dolor a las 24 h fue ≤ 3/10.`;
    else if(w>=2&&x.t==='iso'){b.t+=15;cue=`Semana ${w+1} de la fase: +1 serie y +15 s por serie.`}
    else if(['cardio','espec'].includes(x.t)){b.min+=Math.min(15,5*w);cue=`Semana ${w+1} de la fase: +${Math.min(15,5*w)} min.`}
    else if(x.t!=='cardio'&&x.t!=='espec')cue=`Semana ${w+1} de la fase: +1 serie.`;
  }
  return {...b,cue};
}
function doseStr(d){if(!d)return 'Según indicación';const main=d.min?`${d.min} min`:`${d.s} × ${d.t?d.t+' s':d.r}`;return `${main} · ${d.note}`}
function restFor(x,lv){const r=REST[x.t];return Array.isArray(r)?r[lv]:(r||0)}

/* ===================== Evaluación del caso ===================== */
function evaluate(c){
  const {inj,grade,rev}=eff(c);const cw=cum(grade.w);const wk=weeksSince(c.date);
  let tp=0;for(let i=0;i<4;i++)if(wk>=cw[i])tp=i;
  const total=cw[4];
  const crit=inj.ph[c.phase].cr.map((_,i)=>critState(c,c.phase,i));
  const nDone=crit.filter(x=>x.met).length;const all=nDone===crit.length;
  const ps=painState(c);
  const lock=!!(rev&&rev.lock);const approved=rev&&rev.approved!=null?+rev.approved:-1;
  const needApproval=lock&&approved<c.phase+1;
  let rec;
  if(ps.alarm){rec={k:'bad',t:'Señal de alarma registrada',x:logAlarmText(ps.alarm.flags).join(' ')}}
  else if(ps.flag){rec={k:'bad',t:'Reducir carga',x:`Último registro: ${ps.why}. Regla: el dolor debe quedar en 5/10 o menos durante el ejercicio y no aumentar a la mañana siguiente. La dosis ya se ha reducido; no avances de fase hasta que se normalice.`}}
  else if(c.phase<tp&&all&&needApproval){rec={k:'warn',t:'Pendiente de aprobación profesional',x:`Se cumplen el tiempo y los criterios de la fase ${c.phase+1}. Tu profesional ha pedido aprobar cada avance.`}}
  else if(c.phase<tp&&all){rec={k:'ok',t:`Listo para la fase ${c.phase+2}`,x:`Se cumple el tiempo mínimo de tejido y todos los criterios de la fase ${c.phase+1}. El dolor está controlado.`,adv:true}}
  else if(c.phase<tp){rec={k:'warn',t:`Por tiempo tocaría la fase ${tp+1}`,x:`Faltan ${crit.length-nDone} de ${crit.length} criterios de la fase ${c.phase+1}. El tiempo solo no basta: trabaja los criterios pendientes.`}}
  else if(c.phase===3&&all){rec={k:'ok',t:'Criterios de retorno cumplidos',x:'Revisa la lista de retorno al deporte y confirma el alta con el profesional.'}}
  else if(c.phase<3&&all){rec={k:'info',t:'Criterios cumplidos antes de tiempo',x:`La fase ${c.phase+2} empieza por tiempo en la semana ${+cw[c.phase+1].toFixed(1)}. El tejido necesita tiempo: mantén la fase o avanza solo con aprobación profesional.`}}
  else rec={k:'info',t:'Mantener fase y dosis',x:`Completa los criterios de la fase ${c.phase+1}: ${nDone} de ${crit.length} cumplidos.`};
  let lv=null;const l3=ps.logs.slice(-3);
  if(ps.flag&&c.level>0)lv={to:c.level-1,why:'El dolor superó el umbral en el último registro.'};
  else if(!ps.flag&&l3.length===3&&c.level<2&&l3.every(l=>l.during<=2&&l.comp>=90&&l.rpe<=6))lv={to:c.level+1,why:'Tres sesiones completas con dolor ≤ 2/10 y esfuerzo moderado.'};
  return {wk,tp,cw,total,nDone,all,crit,rec,lv,ps,lock,needApproval};
}
function autoStep(c){
  if(!c||!c.auto)return;
  const e=evaluate(c);
  if(e.rec.adv&&c.phase<3){c.phase++;c.phaseStart=todayISO();c.hist.push({d:todayISO(),t:`Avance automático a la fase ${c.phase+1}`});UI.viewPhase=null;save(c);toast(`Avance automático a la fase ${c.phase+1}`)}
}

/* ===================== Adherencia y semáforo ===================== */
function activeDays(c){const s=new Set();c.logs.forEach(l=>s.add(l.date));c.sessions.forEach(x=>s.add(x.date));Object.keys(c.done).forEach(d=>s.add(d));return s}
function adherence(c){
  const act=activeDays(c);let sched=0,hit=0;const start=c.date>addDays(todayISO(),-14)?c.date:addDays(todayISO(),-14);
  for(let d=start;d<todayISO();d=addDays(d,1)){const dow=new Date(d+'T00:00:00').getDay();if(c.days.includes(dow)){sched++;if(act.has(d)||act.has(addDays(d,1))||act.has(addDays(d,-1)))hit++}}
  return sched?Math.round(100*hit/sched):null;
}
function lastActivity(c){const a=[...activeDays(c)].sort();return a[a.length-1]||null}
function caseSummary(c){
  const e=evaluate(c);const {inj,src}=eff(c);const reasons=[];let st='verde';
  if(e.ps.alarm){st='rojo';reasons.push('Señal de alarma')}
  if(e.ps.flag){st='rojo';reasons.push('Dolor por encima del umbral')}
  const la=lastActivity(c);const idle=la?daysBetween(la,todayISO()):daysBetween(c.date,todayISO());
  const adh=adherence(c);
  if(idle>=5){if(st!=='rojo')st='ambar';reasons.push(`${idle} días sin actividad`)}
  if(adh!=null&&adh<50){if(st!=='rojo')st='ambar';reasons.push(`Adherencia ${adh} %`)}
  if(src!=='pro'){if(st==='verde')st='ambar';reasons.push('Diagnóstico sin validar')}
  if(e.needApproval&&e.all){if(st==='verde')st='ambar';reasons.push('Espera tu aprobación de fase')}
  return {st,reasons,inj:inj.n,phase:c.phase+1,last:la,adh,name:c.name,id:c.id,side:c.side,pain:e.ps.last?e.ps.last.during:null};
}

/* ===================== Gráficos ===================== */
function lineChart(series,o){
  o=o||{};const pts=series.flatMap(s=>s.pts);if(pts.length<2)return `<p class="muted small">${o.empty||'Registra al menos dos valores para ver la evolución.'}</p>`;
  const dates=[...new Set(pts.map(p=>p.x))].sort();const W=640,H=o.h||220,pl=36,pr=14,pt=12,pb=30;
  const ys=pts.map(p=>p.y);let lo=o.min??Math.min(...ys),hi=o.max??Math.max(...ys);if(hi===lo){hi+=1;lo=Math.max(0,lo-1)}
  const pad=(hi-lo)*0.08;if(o.min==null)lo=Math.max(0,lo-pad);if(o.max==null)hi+=pad;
  const X=d=>pl+(dates.length===1?0:dates.indexOf(d)*(W-pl-pr)/(dates.length-1)),Y=v=>pt+(hi-v)*(H-pt-pb)/(hi-lo);
  const ticks=5;const step=(hi-lo)/(ticks-1);const tv=Array.from({length:ticks},(_,i)=>lo+i*step);
  const ds=Math.ceil(dates.length/7);
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label||'Gráfico')}">
  ${o.zone?`<rect class="zone" x="${pl}" y="${Y(Math.min(hi,o.zone[1]))}" width="${W-pl-pr}" height="${Math.max(0,Y(o.zone[0])-Y(Math.min(hi,o.zone[1])))}"/>`:''}
  ${tv.map(v=>`<line class="g" x1="${pl}" x2="${W-pr}" y1="${Y(v)}" y2="${Y(v)}"/><text class="lx" x="${pl-8}" y="${Y(v)+4}" text-anchor="end">${Math.abs(v)>=100||Number.isInteger(+v.toFixed(1))?Math.round(v):v.toFixed(1)}</text>`).join('')}
  ${dates.map((d,i)=>i%ds===0||i===dates.length-1?`<text class="lx" x="${X(d)}" y="${H-8}" text-anchor="middle">${fmtShort(d)}</text>`:'').join('')}
  ${series.map(s=>{const p=s.pts.slice().sort((a,b)=>a.x<b.x?-1:1);return `<path class="${s.cls}" d="${p.map((q,i)=>`${i?'L':'M'}${X(q.x).toFixed(1)},${Y(q.y).toFixed(1)}`).join('')}"/>${p.map((q,i)=>`<circle class="${s.dot}" cx="${X(q.x)}" cy="${Y(q.y)}" r="${i===p.length-1?5:3.2}"><title>${fmtShort(q.x)}: ${q.y}</title></circle>`).join('')}`}).join('')}
  </svg>`;
}

const IS_NATIVE=!!(window.Capacitor&&typeof window.Capacitor.isNativePlatform==='function'&&window.Capacitor.isNativePlatform());
const capPlug=(g,n)=>(window[g]&&window[g][n])||(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins[n])||null;
const blobB64=b=>new Promise((ok,ko)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=ko;r.readAsDataURL(b)});
async function nativeSave(name,blob){
  const Fs=capPlug('capacitorFilesystem','Filesystem'),Sh=capPlug('capacitorShare','Share');
  if(!Fs||!Sh){toast('No se pudo preparar el archivo en esta versión.');return false}
  try{const w=await Fs.writeFile({path:name,data:await blobB64(blob),directory:'CACHE'});await Sh.share({title:name,url:w.uri,dialogTitle:'Guardar o compartir'});return true}
  catch(err){if(!/cancel/i.test(String(err&&err.message)))toast('No se pudo compartir el archivo.');return false}
}

/* ===================== Nube (db + user + assets + downloads) ===================== */
const CL={db:null,user:null,assets:null,dl:null,uid:null,admin:false,write:null,status:'local',rev:{},msgs:[],patients:[],names:{},sel:null,timers:{},chains:{},pending:new Set(),firstSnap:true,unsubSel:[],sumTimer:null};
const CBASE=()=>'pacientes/'+CL.uid;
function setStatus(s){if(CL.status==='readonly'&&s!=='local')return;CL.status=s;renderNav()}
function handleErr(e){
  const code=e&&e.code;
  if(code==='invalid_argument'||code==='not_granted'){CL.status='readonly';toast('Tu cuenta no puede guardar en la nube: los datos quedan en este dispositivo.')}
  else if(code==='quota_exceeded'){toast('La base de datos está llena. Borra casos antiguos para seguir guardando en la nube.');CL.status='error'}
  else if(code==='revoked'){CL.status='local'}
  else CL.status='error';
  renderNav();
}
function cleanCase(c){const o=JSON.parse(JSON.stringify(c));delete o._rev;delete o._remote;delete o.synced;return o}
function cloudDirty(c){
  if(!c)return;c.updatedAt=Date.now();
  if(!CL.db||!CL.uid||c.example||CL.status==='readonly'||CL.status==='local')return;
  CL.pending.add(c.id);clearTimeout(CL.timers[c.id]);CL.timers[c.id]=setTimeout(()=>pushCase(c),1200);schedSummary();
}
function pushCase(c){
  if(!CL.db||!CL.uid||c.example)return;
  const ref=CL.db.doc(CBASE()+'/casos/'+c.id);
  CL.chains[c.id]=(CL.chains[c.id]||Promise.resolve()).then(async()=>{
    setStatus('saving');
    try{await ref.set(cleanCase(c));c.synced=true;CL.pending.delete(c.id);saveLocal();setStatus('sync')}catch(e){handleErr(e)}
  });
}
function cloudDelete(id){
  if(!CL.db||!CL.uid)return;
  CL.chains[id]=(CL.chains[id]||Promise.resolve()).then(()=>CL.db.doc(CBASE()+'/casos/'+id).delete().catch(handleErr));schedSummary();
}
function schedSummary(){

function onMyCases(snap){

}

  REM_T.forEach(clearTimeout);REM_T=[];
  if(IS_NATIVE){nativeReminders();return}
  const r=S.settings.remind;if(!r.on||!IS_PWA||!('Notification' in window)||Notification.permission!=='granted')return;
  const c=active();if(!c)return;const now=new Date();
  const at=hm=>{const [h,m]=hm.split(':').map(Number);const d=new Date();d.setHours(h,m,0,0);return d-now};
  const notify=(t,b)=>{navigator.serviceWorker&&navigator.serviceWorker.ready.then(reg=>reg.showNotification(t,{body:b,icon:'icon-192.png',tag:t})).catch(()=>{try{new Notification(t,{body:b})}catch(e){}})};
  const dm=at(r.morning);if(dm>0)REM_T.push(setTimeout(()=>notify('Kinetrack','¿Cómo amaneciste? Registra el dolor al levantarte.'),dm));
  const ds=at(r.session);if(ds>0&&c.days.includes(now.getDay()))REM_T.push(setTimeout(()=>notify('Kinetrack','Hoy toca sesión de rehabilitación.'),ds));
}
function icsFor(c){
  const r=S.settings.remind;const e=evaluate(c);const until=addDays(c.date,e.total*7).replace(/-/g,'');const st=todayISO().replace(/-/g,'');
  const by=c.days.map(d=>['SU','MO','TU','WE','TH','FR','SA'][d]).join(',');const hm=t=>t.replace(':','')+'00';
  const ev=(u,summary,time,rule)=>`BEGIN:VEVENT\r\nUID:${u}@kinetrack\r\nDTSTAMP:${st}T000000Z\r\nDTSTART:${st}T${hm(time)}\r\nDURATION:PT30M\r\nRRULE:${rule};UNTIL=${until}T235959Z\r\nSUMMARY:${summary}\r\nBEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:${summary}\r\nTRIGGER:PT0M\r\nEND:VALARM\r\nEND:VEVENT\r\n`;
  return `BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Kinetrack//ES\r\n${by?ev(c.id+'s','Sesión de rehabilitación',r.session,'FREQ=WEEKLY;BYDAY='+by):''}${ev(c.id+'m','Kinetrack: dolor al levantarte',r.morning,'FREQ=DAILY')}END:VCALENDAR\r\n`;
}

/* ===================== Guía ===================== */
function vGuide(){
  const sec=(id,t,body)=>`<section class="card guide" id="${id}"><h2>${t}</h2>${body}</section>`;
  const toc=[['g_inicio','Primeros pasos'],['g_diag','Diagnóstico guiado'],['g_prog','Programa'],['g_ses','Sesión guiada'],['g_seg','Seguimiento'],['g_pro','Trabajo con el profesional'],['g_lib','Biblioteca y contenido'],['g_app','Instalar la app'],['g_val','Validación y límites'],['legal','Aviso legal y privacidad']];
  return `<section class="view-head"><p class="eyebrow">Guía</p><h1>Cómo usar Kinetrack</h1><p class="lede">Del primer síntoma a la vuelta al deporte, paso a paso.</p></section>
  <nav class="toc" aria-label="Índice">${toc.map(([id,n],i)=>`<a href="#${id}" data-act="jump" data-id="${id}"><span class="num">${i+1}</span>${n}</a>`).join('')}</nav>
  ${sec('g_inicio','1. Primeros pasos',`<ol class="steps"><li>Elige tu perfil en la tarjeta de bienvenida: <b>deportista</b> o <b>profesional</b>. El perfil cambia el panel: el profesional ve el semáforo de pacientes; el deportista, los mensajes y revisiones de su profesional.</li><li>Acepta el aviso: los resultados son orientativos y tus datos de salud se guardan en el dispositivo (y en la nube si usas cuenta).</li><li>El caso de ejemplo (Lucía, esguince de tobillo) muestra la app funcionando. Bórralo desde Programa → Caso → Borrar caso cuando quieras.</li><li>Arriba a la derecha eliges el caso activo o creas uno nuevo. La etiqueta junto al selector indica si los datos están solo en este dispositivo o sincronizados.</li></ol>`)}
  ${sec('g_diag','2. Diagnóstico guiado',`<ol class="steps"><li><b>Zona y lado.</b> Toca el mapa (vista delante o detrás) o los botones de zona. La vista posterior marca además el dolor en la cara de atrás.</li><li><b>Contexto.</b> Deporte, cómo empezó (de golpe o poco a poco), edad, dolor actual y si es una lesión repetida. Cada dato ajusta la probabilidad: por ejemplo, en fútbol suben los isquiotibiales y los aductores; una lesión de golpe resta peso a las tendinopatías.</li><li><b>Mecanismo y síntomas.</b> Marca todo lo que encaje. Un síntoma que no corresponde a una lesión le resta puntos.</li><li><b>Signos de alarma.</b> Si marcas alguno, aparece un aviso rojo con qué hacer (urgencias, radiografía, retirar del juego…). Las reglas de Ottawa y la sospecha de conmoción saltan solas.</li><li><b>Pruebas clínicas.</b> En cada lesión candidata, abre «Pruebas para confirmar o descartar» y marca <b>+</b> o <b>−</b>. La app aplica el teorema de Bayes con la sensibilidad y especificidad de cada prueba: una prueba muy específica y positiva sube mucho la probabilidad; una muy sensible y negativa la baja. El botón <b>?</b> explica cómo hacerla.</li><li><b>Crear programa</b> desde la lesión elegida, o por selección manual si ya tienes el diagnóstico de un profesional.</li></ol>`)}
  ${sec('g_prog','3. Programa por fases',`<ul class="bul"><li><b>Fases.</b> Cuatro fases (protección, carga temprana, fuerza, retorno) con duración según el grado o tratamiento. La línea de tiempo marca hoy y la fecha estimada de retorno; toca una fase para ver su contenido.</li><li><b>Nivel.</b> Principiante, intermedio o avanzado cambian la variante y la dosis de cada ejercicio. La app sugiere bajar de nivel si el dolor supera el umbral y subir tras tres sesiones completas con dolor ≤ 2/10.</li><li><b>Dosis semanal.</b> En la semana 2 de cada fase se añade una serie; a partir de la 3 se sube la carga o el tiempo. Si el dolor supera el umbral, la dosis baja sola.</li><li><b>Material.</b> En Editar datos marca el material que tienes (banda, mancuernas, escalón, gimnasio). Los ejercicios que no puedes hacer se cambian por una alternativa del mismo grupo muscular.</li><li><b>Esto me duele.</b> Cambia ese ejercicio por una alternativa y no lo vuelve a proponer.</li><li><b>Criterios.</b> Para salir de cada fase hay que cumplir criterios objetivos. Los que dependen de una medición, escala o del dolor se marcan solos («Medido»); el resto se marcan a mano.</li><li><b>Avance automático o manual.</b> En automático, la fase avanza sola cuando se cumplen el tiempo mínimo, todos los criterios y el dolor está controlado. El profesional puede exigir su aprobación para cada avance.</li><li><b>Dolor al levantarte.</b> Cada mañana toca el número de 0 a 10. Es la señal principal de la regla de dolor: si sube 2 puntos o pasa de 5, la carga baja.</li><li><b>Calendario.</b> Elige los días de sesión; la franja muestra sesiones hechas, perdidas y próximas, y la adherencia de las últimas 2 semanas.</li></ul>`)}
  ${sec('g_ses','4. Sesión guiada',`<ol class="steps"><li>Pulsa <b>Empezar sesión guiada</b> en Programa. La pantalla se mantiene encendida si el dispositivo lo permite.</li><li>Cada ejercicio muestra variante, dosis, indicación y vídeo. Para isometrías y cardio hay cronómetro con aviso sonoro; para repeticiones, el botón «Serie hecha».</li><li>Anota kilos y repeticiones reales en la tabla: alimentan el gráfico de cargas.</li><li>Entre series corre el descanso (se puede saltar). Al terminar el ejercicio, marca el dolor de 0 a 10.</li><li>Al final indica el esfuerzo (RPE) y cualquier señal de alarma. Se guarda un registro con el dolor máximo, el % completado y el RPE.</li></ol>`)}
  ${sec('g_seg','5. Seguimiento',`<ul class="bul"><li><b>Dolor.</b> Gráfico de dolor durante la sesión y al levantarse, con la zona por encima del umbral sombreada.</li><li><b>Registros y alarmas.</b> Puedes registrar sesiones a mano. Si marcas una alarma (pantorrilla caliente, fiebre, hormigueo nuevo…), el programa muestra qué hacer y se detiene la progresión.</li><li><b>Mediciones.</b> 24 medidas (goniometría, perímetros, fuerza, equilibrio, Y-balance…) con el lado sano como referencia. El índice de simetría (LSI) se calcula solo y alimenta los criterios.</li><li><b>Batería de saltos.</b> Salto simple, triple, triple cruzado y 6 m: el criterio de retorno exige LSI ≥ 90 %.</li><li><b>Cargas.</b> Progresión de kilos o repeticiones por ejercicio a partir de las sesiones guiadas.</li><li><b>Escalas validadas.</b> KOOS, IKDC, Lysholm, ACL-RSI, VISA-P, VISA-A, FAAM, LEFS, HAGOS, QuickDASH, Oswestry, NDI y Tampa. Se rellena el formulario oficial validado en español y se anotan aquí las puntuaciones por ítem; la app calcula el resultado y lo grafica.</li><li><b>Vídeos de técnica.</b> En la versión web con cuenta, sube un vídeo corto desde cada ejercicio para que tu profesional lo revise.</li></ul>`)}
  ${sec('g_pro','6. Trabajo con el profesional',`<ul class="bul"><li><b>Validación.</b> En Programa, el profesional registra el diagnóstico confirmado, el grado, la imagen y las indicaciones. Sustituye al diagnóstico automático y puede cambiar ejercicios y exigir su aprobación para avanzar.</li><li><b>Panel con semáforo.</b> El perfil profesional ve todos sus casos: rojo si hay dolor por encima del umbral o una alarma; ámbar si hay días sin actividad, poca adherencia, diagnóstico sin validar o una fase esperando aprobación.</li><li><b>Con cuenta (versión web).</b> El propietario de la app comparte el enlace desde el menú Compartir: los <b>profesionales como editores</b> (ven a todos los pacientes) y los <b>pacientes como colaboradores</b> (solo ven lo suyo). Cada paciente sincroniza sus casos; el profesional los revisa, deja su revisión y escribe mensajes. Que los pacientes puedan guardar depende del plan: en planes con organización (Team o Enterprise) los miembros colaboradores sí guardan; las personas invitadas desde fuera de la organización solo pueden ver.</li><li><b>Sin cuenta.</b> El deportista lleva el <b>informe PDF</b> a la consulta o envía una <b>copia del caso</b> (Ajustes → Datos) que el profesional importa.</li></ul>`)}
  ${sec('g_lib','7. Biblioteca y contenido clínico',`<ul class="bul"><li><b>Lesiones:</b> ${INJ.length} fichas con mecanismo, síntomas, pruebas, grados y plazos, fases, criterios de retorno, prevención y referencias.</li><li><b>Pruebas:</b> ${TESTS.length} pruebas con técnica, positivo, sensibilidad, especificidad y razones de verosimilitud.</li><li><b>Ejercicios:</b> ${Object.keys(EX).length} ejercicios con variante, dosis, material y vídeo por nivel, y sus alternativas.</li><li><b>Editor de contenido</b> (Ajustes → Contenido clínico): el equipo clínico corrige textos, criterios de retorno, referencias y vídeos sin programar, y marca cada ficha como revisada con su nombre y fecha. Con cuenta, los cambios de un editor llegan a todos.</li></ul>`)}
  ${sec('g_app','8. Instalar la app',`<p>Hay dos versiones con las mismas funciones clínicas:</p><ul class="bul"><li><b>Versión web</b> (este enlace): cuentas, sincronización, panel de pacientes, mensajes y vídeos de técnica.</li><li><b>App instalable (PWA)</b>: funciona sin conexión y guarda los datos en el dispositivo. Añade notificaciones de recordatorio y exporta el calendario de sesiones a tu agenda (.ics). Se publica subiendo la carpeta a un hosting con HTTPS y se instala desde el navegador con «Instalar app» o «Añadir a pantalla de inicio».</li></ul>`)}
  ${sec('g_val','9. Validación y límites',`<p>El motor de diagnóstico se probó con ${VALID.n+VALID.hn} casos clínicos ficticios escritos para esta prueba:</p><div class="scroll-x"><table class="log"><thead><tr><th>Tipo de caso</th><th>Casos</th><th>1.ª opción correcta</th><th>Entre las 3 primeras</th><th>1.ª opción con pruebas</th></tr></thead><tbody><tr><td class="n">Típicos (mecanismo y síntomas completos)</td><td>${VALID.n}</td><td>${VALID.top1} %</td><td>${VALID.top3} %</td><td>${VALID.top1t} %</td></tr><tr><td class="n">Difíciles (información parcial o lesiones parecidas)</td><td>${VALID.hn}</td><td>${VALID.htop1} %</td><td>${VALID.htop3} %</td><td>${VALID.htop1t} %</td></tr></tbody></table></div><p>En los casos difíciles, las lesiones parecidas (menisco y ligamento colateral, esguince lateral y sindesmosis, dolor patelofemoral y tendinopatía rotuliana) se separan sobre todo al registrar las pruebas clínicas.</p><p class="small muted">Esto comprueba que el motor funciona como se diseñó, no su precisión real: los casos los redactó el mismo equipo que el motor. Antes de usarla con pacientes, un equipo clínico debe revisar las fichas (Ajustes → Contenido clínico) y validarla con casos reales.</p>`)}
  ${sec('legal','10. Aviso legal y privacidad',`<ul class="bul"><li>Kinetrack es una herramienta de apoyo y educación. No es un dispositivo médico certificado y no sustituye la exploración, el diagnóstico ni el tratamiento de un profesional sanitario. Ante un signo de alarma, acude a urgencias.</li><li>En muchos países, un programa que propone diagnósticos puede considerarse dispositivo médico. Antes de un uso comercial o clínico conviene asesoramiento legal y regulatorio.</li><li><b>Dónde están tus datos.</b> Sin cuenta, solo en este navegador o dispositivo. Con cuenta, en la base de datos de esta app: tus casos los ven tú, el propietario de la app y quienes tengan permiso de editor (tus profesionales). Otros pacientes no los ven.</li><li><b>Tus derechos.</b> Puedes exportar tus datos (Ajustes → Datos) y borrarlos en cualquier momento; borrar un caso lo borra también de la nube.</li><li><b>Consentimiento.</b> Se registra la fecha en que lo aceptaste y puedes retirarlo en Ajustes → Perfil, lo que borra tus datos de este dispositivo y de tu cuenta.</li><li>Los vídeos enlazados son de canales externos de YouTube; Kinetrack no se responsabiliza de su contenido.</li></ul>`)}`;
}

function newCaseSheet(injId,pct){
  if(!S.settings.consent){consentSheet(()=>newCaseSheet(injId,pct));return}
  const inj=INJ_BY[injId]||INJ[0];const d=S.diag;
  const c={name:'',sport:d.sport||'',injuryId:inj.id,side:d.side||'der',g:inj.g.length===3?1:0,level:1,date:todayISO(),equip:['n','b','m','c'],days:[1,3,5]};
  openSheet(`<form data-on="new-form" data-pct="${pct||''}" data-src="${pct?'auto':'manual'}" class="stack">

 if(on==='new-form'){const d=readCase('nc');const c=normCase({id:uid(),...d,src:f.dataset.src,autoPct:f.dataset.pct?+f.dataset.pct:null,phase:0,phaseStart:d.date,auto:true,crit:{},logs:[],done:{},meas:[],scales:[],sessions:[],pro:null,hist:[{d:todayISO(),t:'Caso creado'}]});S.cases.push(c);S.active=c.id;UI.viewPhase=null;save(c);closeSheet();if(curView()==='programa')render();else location.hash='programa';toast('Programa creado')}
 else if(on==='edit-form'){const c=active();const d=readCase('ed');const changed=d.injuryId!==c.injuryId;Object.assign(c,d);if(changed){c.phase=0;c.phaseStart=todayISO();c.crit={};c.swaps={};c.src='manual';c.hist.push({d:todayISO(),t:'Lesión cambiada manualmente; fase reiniciada'})}c.example=false;UI.editOpen=false;save(c);render();toast('Caso actualizado')}
 else if(on==='pro-form'){const c=active();const prevEff=eff(c).inj.id;const dx=$('#pro_dx').value;const swaps={};f.querySelectorAll('[data-swap]').forEach(s=>{if(s.value)swaps[s.dataset.swap]=s.value});
   c.pro={name:$('#pro_name').value.trim(),spec:$('#pro_spec').value,dx,g:+$('#pro_g').value,date:$('#pro_date').value,img:$('#pro_img').value.trim(),notes:$('#pro_notes').value.trim(),lock:$('#pro_lock').checked,approved:(c.pro&&c.pro.approved)||null,swaps,prevDx:c.injuryId};
   if(dx!==prevEff){c.phase=0;c.phaseStart=todayISO();c.crit={};c.hist.push({d:todayISO(),t:`Diagnóstico profesional: ${INJ_BY[dx].n}; fase reiniciada`})}else c.hist.push({d:todayISO(),t:'Diagnóstico validado por profesional'});
   save(c);render();toast('Validación guardada')}
 else if(on==='rev-form'){const [pid,cid]=UI.panelSel.split('|');const swaps={};f.querySelectorAll('[data-swap]').forEach(s=>{if(s.value)swaps[s.dataset.swap]=s.value});const c=CL.sel.cases.find(x=>x.id===cid);
   const r={dx:$('#rv_dx').value,g:+$('#rv_g').value,name:$('#rv_name').value.trim(),img:$('#rv_img').value.trim(),notes:$('#rv_notes').value.trim(),lock:$('#rv_lock').checked,approved:$('#rv_appr')&&$('#rv_appr').checked?c.phase+1:((CL.sel.rev[cid]||{}).approved??null),swaps,by:CL.uid,date:todayISO(),updatedAt:Date.now()};
   CL.db.doc(`pacientes/${pid}/revision/${cid}`).set(r).then(()=>toast('Revisión guardada; el paciente la verá en su programa')).catch(handleErr)}
 else if(on==='msg-form'){const inp=f.querySelector('input');const text=inp.value.trim();if(!text||!CL.db)return;const who=f.dataset.who;
   let path,caseId=null;if(who==='pro'){const [pid,cid]=UI.panelSel.split('|');path=`pacientes/${pid}/mensajes`;caseId=cid}else{path=CBASE()+'/mensajes';caseId=S.active}
   CL.db.collection(path).add({from:CL.uid,pro:who==='pro',text,ts:Date.now(),caseId}).then(()=>{inp.value=''}).catch(handleErr)}
 else if(on==='log-form'){const c=active();const flags=[...f.querySelectorAll('[data-flag]:checked')].map(i=>i.dataset.flag);const date=$('#lg_date').value||todayISO();
   c.logs.push({id:uid(),date,during:+$('#lg_during').value,comp:clamp(+$('#lg_comp').value||0,0,100),rpe:+$('#lg_rpe').value,notes:$('#lg_notes').value.trim(),flags});c.mornings[date]=+$('#lg_morning').value;save(c);render();toast(flags.length?'Registro guardado con señal de alarma':'Registro guardado')}
 else if(on==='hop-form'){const c=active();let n=0;MEAS.filter(m=>m.hop).forEach(m=>{const a=num($(`#hop_${m.k}_a`).value),b=num($(`#hop_${m.k}_b`).value);if(a>0&&b>0){c.meas.push({id:uid(),date:todayISO(),k:m.k,a,b});n++}});if(!n){toast('Introduce los valores de ambas piernas.');return}save(c);render();toast(`${n} prueba(s) de salto guardadas`)}
 else if(on==='meas-form'){const c=active();const k=$('#ms_k').value;const md=MEAS_BY[k];const a=num($('#ms_a').value),b=md.single?null:num($('#ms_b').value);if(a==null||(!md.single&&b==null)){toast('Introduce valores numéricos.');return}c.meas.push({id:uid(),date:$('#ms_date').value||todayISO(),k,a,b});UI.measSel=k;save(c);render(true);toast('Medición añadida')}
 else if(on==='scale-form'){const c=active();const k=$('#sc_sel').value;const r=scLive();if(!r||!r.sc){toast('Faltan ítems para calcular el resultado.');return}c.scales.push({id:uid(),date:todayISO(),k,vals:r.vals,total:$('#sc_total')?$('#sc_total').value:null});UI.scaleOpen=false;save(c);render();toast(`${SCALES[k].n}: ${r.sc.total}`)}
 else if(on==='rem-form'){S.settings.remind={on:$('#rm_on').checked,morning:$('#rm_m').value||'08:00',session:$('#rm_s').value||'18:00'};saveLocal();scheduleReminders();toast('Recordatorios guardados')}
 else if(on==='ed-inj'){const id=$('#ed_inj').value;const lines=v=>v.split('\n').map(x=>x.trim()).filter(Boolean);OV.inj=OV.inj||{};
   OV.inj[id]={d:$('#ei_d').value.trim(),img:$('#ei_img').value.trim(),prev:$('#ei_prev').value.trim(),rts:lines($('#ei_rts').value),ref:lines($('#ei_ref').value),rev:{by:$('#ei_by').value.trim(),date:$('#ei_date').value,ok:$('#ei_ok').checked}};saveOV();render(true);toast('Ficha guardada')}
 else if(on==='ed-ex'){const id=$('#ed_ex').value;OV.ex=OV.ex||{};const vid=[0,1,2].map(i=>$('#ee_v'+i).value.trim());OV.ex[id]={c:$('#ee_c').value.trim(),vid:vid.some(Boolean)?vid:null};saveOV();render(true);toast('Ejercicio guardado')}
});
window.addEventListener('hashchange',()=>{closeSheet();render();window.scrollTo(0,0);if(curView()==='panel'&&!isPro()){S.settings.msgSeen=Date.now();saveLocal()}});
if(IS_PWA){window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();window._bip=e;$('#install_btn').hidden=false})}
render();
cloudInit();
scheduleReminders();

</script>

<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
</body>
</html>

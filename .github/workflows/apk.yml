name: Generar APK

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'privacidad.html']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Instalar Capacitor y librerías
        run: |
          npm install --no-audit --no-fund
          pip install pillow

      - name: Preparar la web para el APK
        run: |
          rm -rf www && mkdir www
          cp index.html manifest.webmanifest privacidad.html icon.svg icon-192.png icon-512.png icon-512-maskable.png www/
          cp node_modules/jspdf/dist/jspdf.umd.min.js www/
          cp node_modules/@capacitor/core/dist/capacitor.js www/ || echo "::warning::Falta capacitor.js"
          cp node_modules/@capacitor/filesystem/dist/plugin.js www/cap-filesystem.js || echo "::warning::Falta el plugin de archivos"
          cp node_modules/@capacitor/share/dist/plugin.js www/cap-share.js || echo "::warning::Falta el plugin de compartir"
          cp node_modules/@capacitor/local-notifications/dist/plugin.js www/cap-notifications.js || echo "::warning::Falta el plugin de notificaciones"
          python3 scripts/preparar_apk.py www/index.html

      - name: Crear el proyecto Android
        run: |
          npx cap add android
          npx cap sync android
          python3 scripts/ajustar_android.py ${{ github.run_number }}

      - name: Compilar
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Firmar el APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > firma.jks
            PASS="$KEYSTORE_PASSWORD"; ALIAS="$KEY_ALIAS"
          else
            echo "::warning::Sin clave de firma fija: este APK usa una clave temporal. Para poder actualizar la app sin desinstalarla, ejecuta el flujo 'Crear clave de firma' (ver README)."
            PASS=temporal123; ALIAS=kinetrack
            keytool -genkeypair -keystore firma.jks -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 -storepass "$PASS" -keypass "$PASS" -dname "CN=Kinetrack"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks firma.jks --ks-key-alias "$ALIAS" --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --out Kinetrack.apk aligned.apk
          "$BT/apksigner" verify Kinetrack.apk
          rm -f firma.jks

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: Kinetrack-apk
          path: Kinetrack.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Kinetrack 1.0.${{ github.run_number }}
          body: APK de Kinetrack generado automáticamente. Descarga Kinetrack.apk e instálalo en Android.
          files: Kinetrack.apk
